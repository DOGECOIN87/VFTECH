# Publishes design-3/ at the site root, with site/ (design 1) at /design-1/ and design-2/ at /design-2/, to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'design-2/**', 'design-3/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # design 3 is the site; designs 1 and 2 are kept alongside it at /design-1/ and /design-2/
      - name: Assemble the three designs
        run: |
          mkdir -p _site
          cp -r design-3/. _site/
          rm -rf _site/src _site/README.md
          for n in 1 2; do
            src=site; [ "$n" = 2 ] && src=design-2
            mkdir -p _site/design-$n
            cp -r $src/. _site/design-$n/
            rm -rf _site/design-$n/src _site/design-$n/README.md _site/design-$n/social _site/design-$n/preview-*.png
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
