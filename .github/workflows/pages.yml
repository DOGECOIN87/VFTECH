# Publishes design-3/ at the site root, with site/ (design 1) at /design-1/, design-2/ at /design-2/ and design-4/ at /design-4/ and design-5/ to design-10/ at /design-N/, to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'design-2/**', 'design-3/**', 'design-4/**', 'design-5/**', 'design-6/**', 'design-7/**', 'design-8/**', 'design-9/**', 'design-10/**', 'scripts/assemble.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # design 3 at the root, designs 1, 2, 4 and 5 in design-N/, asset URLs stamped with the run number
      - name: Assemble the five designs
        run: bash scripts/assemble.sh ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
