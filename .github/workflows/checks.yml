# Opens every page of all ten designs in a real browser before anything reaches main.
# Fails on script errors, missing files, sideways scrolling, content that never appears, unreadable
# text contrast, or shared files that have drifted between designs. Screenshots of every page are
# attached to the run as the "site-screenshots" artifact.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax and shared-file sync
        run: npm run check
      - name: Assemble the site as Pages serves it
        run: bash scripts/assemble.sh ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check motion, native navigation and graceful fallback
        run: node tests/motion-browser.mjs
      - name: Check every page
        run: node scripts/check-site.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: checks-out/
          retention-days: 14
